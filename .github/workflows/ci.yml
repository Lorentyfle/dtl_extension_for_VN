# Runs the tests (test/run.js, in a real VS Code) on Linux and Windows, then
# builds the .vsix, on every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Downloads the VS Code the tests run in (see test/run.js).
      - run: npm install --no-save @vscode/test-electron
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test
        if: runner.os != 'Linux'
        run: npm test

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: dtl-reader-vsix
          path: '*.vsix'
